{% extends 'base.html' %}

{% block title %}Error {{ code }} - HealthGuard AI{% endblock %}

{% block content %}
<main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="card" style="max-width: 500px; padding: 3rem; text-align: center; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    <div style="font-size: 4rem; font-weight: 800; color: var(--primary); line-height: 1;">{{ code }}</div>
    <h1 style="font-size: 1.4rem; font-weight: 700; margin: 1rem 0 0.5rem 0;">Clinical Service Notice</h1>
    <p style="color: var(--textmuted); font-size: 0.95rem; margin-bottom: 2rem;">{{ message }}</p>
    <a href="{{ url_for('landing') }}" class="btn-pill btn-primary">
      <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
      <span>Return to Safe Harbor</span>
    </a>
  </div>
</main>
{% endblock %}
