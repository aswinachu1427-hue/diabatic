<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HealthGuard AI - Diabetes Risk Intelligence Platform{% endblock %}</title>
  
  <!-- Plus Jakarta Sans Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js for Trend Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <!-- Ambient Floating 3D Pastel Orbs -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Main Content Block -->
  {% block content %}{% endblock %}

  <!-- Core JavaScript -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  
  <!-- Server Flash Message Converter to Dynamic Toasts -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          {% for category, message in messages %}
            showToast("{{ message }}", "{{ category }}");
          {% endfor %}
        });
      </script>
    {% endif %}
  {% endwith %}

  <!-- Initialize Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
